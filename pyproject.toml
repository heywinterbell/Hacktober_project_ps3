[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimcheck"
version = "0.1.0"
description = "Triage that tests the claims: verify bug reports, security reports, and PRs with deterministic checks and sandboxed execution."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Heywinterbell" }]
keywords = ["triage", "github", "security", "sandbox", "hacktoberfest"]
dependencies = [
    "typer>=0.12,<1",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.4,<1",
]

[project.scripts]
claimcheck = "claimcheck.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".*", "build", "dist"]
markers = [
    "docker: tests that require a working Docker daemon (skipped when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["src/claimcheck"]
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = true
